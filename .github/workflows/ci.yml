name: Offline release checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.14'
      - run: uv sync --locked --python 3.11
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not live"
      - run: uv run python scripts/offline_demo.py --output results/offline-demo
      - run: uv run python scripts/check_release.py
      - run: uv build
      - run: uv venv --python 3.11 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python --no-deps dist/*.whl
      - run: .wheel-venv/bin/python scripts/check_installed.py
      - run: git diff --check
